name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Lint shell scripts
        run: shellcheck -S warning scripts/*.sh
      - name: Lint workflows
        run: |
          # Pinned to a release, so a change upstream cannot change what CI runs
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint .github/workflows/*.yml templates/release.yml
      - name: Skill checks
        run: |
          pip install pyyaml
          DOCKER_BUILD=1 bash scripts/test_skill.sh
