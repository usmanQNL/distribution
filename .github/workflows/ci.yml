name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh templates/*.sh
      - name: Lint workflows
        run: |
          bash -c 'curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash'
          ./actionlint .github/workflows/*.yml templates/release.yml
      - name: Skill checks
        run: bash scripts/test_skill.sh
