name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prune_releases:
        description: "Delete releases in the releases repo older than artifact_retention_days (opt-in)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      location: ${{ steps.loc.outputs.location }}
    steps:
      - uses: actions/checkout@v5
      - name: Read build location
        id: loc
        shell: bash
        run: |
          loc=$(python3 -c "import json;print(json.load(open('distribution.json')).get('build_location','github'))")
          echo "location=$loc" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    if: needs.config.outputs.location == 'github'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Read selected targets
        id: targets
        shell: bash
        run: |
          python3 -c "import json;t=json.load(open('distribution.json'))['targets'];[print(f'{k}={str(v).lower()}') for k,v in t.items()]" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
        shell: bash
      - name: Node SPA build (if selected and package.json has a build script)
        if: steps.targets.outputs.node_spa_zip == 'true'
        shell: bash
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm ci && npm run build
            mkdir -p release && (cd dist && zip -r ../release/frontend-${{ matrix.os }}.zip .)
          fi
      - name: PyInstaller build (if selected and packaging/app.spec exists)
        if: steps.targets.outputs.windows_exe == 'true' || steps.targets.outputs.windows_inno_installer == 'true' || steps.targets.outputs.linux_sh == 'true' || steps.targets.outputs.linux_deb == 'true'
        shell: bash
        run: |
          if [ -f packaging/app.spec ]; then pyinstaller --noconfirm packaging/app.spec
            mkdir -p release
            if [ "$RUNNER_OS" = "Windows" ] && [ "${{ steps.targets.outputs.windows_exe }}" = "true" ]; then cp dist/app.exe release/; fi
            if [ "$RUNNER_OS" = "Linux" ] && { [ "${{ steps.targets.outputs.linux_sh }}" = "true" ] || [ "${{ steps.targets.outputs.linux_deb }}" = "true" ]; }; then cp dist/app release/; fi
          fi
      - name: Linux packages (.sh and .deb, if selected)
        if: runner.os == 'Linux' && (steps.targets.outputs.linux_sh == 'true' || steps.targets.outputs.linux_deb == 'true')
        shell: bash
        run: |
          VER="$(cat VERSION)"
          if [ -d dist/app ]; then SRC=dist/app; elif [ -d dist ]; then SRC=dist; else exit 0; fi
          mkdir -p release && bash scripts/make_sh.sh "$SRC" "release/app-$VER-linux.sh"
          cp scripts/install-linux.sh release/install-linux.sh
          if [ "${{ steps.targets.outputs.linux_deb }}" = "true" ]; then bash scripts/make_deb.sh "$SRC" app "$VER" release; fi
          # The .sh and .deb already contain the Linux binary, so drop the raw copy from the release
          if [ "${{ steps.targets.outputs.linux_sh }}" = "true" ] || [ "${{ steps.targets.outputs.linux_deb }}" = "true" ]; then rm -f release/app; fi
      - name: Inno Setup installer (Windows, if selected)
        if: runner.os == 'Windows' && steps.targets.outputs.windows_inno_installer == 'true'
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          mkdir -p release
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DMyAppVersion=$(cat VERSION)" packaging/installer.iss
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.os }}
          path: release/*
          retention-days: 7

  publish:
    needs: [config, build]
    if: needs.config.outputs.location == 'github'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: bash scripts/checksums.sh release
      - name: Read signing mode
        id: signing
        shell: bash
        run: |
          mode=$(python3 -c "import json;print(json.load(open('distribution.json')).get('signing','cosign'))")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
        if: steps.signing.outputs.mode == 'cosign'
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          pub=""
          if [ -f packaging/keys/release-signing-public.pem ]; then pub=packaging/keys/release-signing-public.pem; fi
          bash scripts/sign.sh release "${{ steps.signing.outputs.mode }}" $pub
      - name: Publish to releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          VERSION="v$(cat VERSION).$(date -u +%Y%m%d_%H%M)"
          gh release create "$VERSION" release/* --repo "${{ vars.RELEASES_REPO || format('{0}-releases', github.repository) }}" --title "$VERSION" --notes "Automated release from ${{ github.sha }}"

  prune:
    if: github.event_name == 'workflow_dispatch' && inputs.prune_releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Delete old releases (opt-in)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        shell: bash
        run: |
          days=$(python3 -c "import json;print(json.load(open('distribution.json')).get('artifact_retention_days',7))")
          repo="${{ vars.RELEASES_REPO || format('{0}-releases', github.repository) }}"
          bash scripts/prune_releases.sh "$repo" "$days"
      - name: Delete build artifacts after a successful publish
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.name | startswith("release-")) | .id')
          for id in $ids; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
