name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
        shell: bash
      - run: pyinstaller --noconfirm packaging/app.spec
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: bash scripts/checksums.sh dist
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        run: bash scripts/sign.sh dist
      - name: Publish to releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          VERSION="v$(cat VERSION).$(date -u +%Y%m%d_%H%M)"
          gh release create "$VERSION" dist/* --repo "${{ github.repository }}-releases" --title "$VERSION" --notes "Automated release from ${{ github.sha }}"
